name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployment is done by Cloudflare Workers Builds (see README), which also
# posts preview URLs on pull requests. This workflow only tests and builds.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so each story gets its "added" date from git
          fetch-depth: 0

      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dictionary sources (JMdict, KANJIDIC2, pitch accents, JLPT lists).
      # Refreshed weekly; the build is deterministic for the same sources.
      # On the first run of a week, last week's sources are restored and then
      # downloaded again. If a download fails, the build uses last week's copy,
      # and the cache is not saved so the next run tries again.
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: dict-cache
        with:
          path: .cache
          key: dict-sources-${{ steps.week.outputs.week }}
          restore-keys: dict-sources-

      - name: Build dictionary
        id: dict
        run: pnpm run data ${{ steps.dict-cache.outputs.cache-hit != 'true' && '-- --refresh' || '' }}

      - if: steps.dict-cache.outputs.cache-hit != 'true' && steps.dict.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: dict-sources-${{ steps.week.outputs.week }}

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Check content
        run: pnpm run audit -- --errors

      - name: Build site
        run: pnpm run build

      - name: Check Worker config
        run: pnpm exec wrangler deploy --dry-run
